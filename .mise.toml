# mise configuration for youtube-comment-downloader
[env]
# Python virtual environment configuration
_.python.venv = { path = ".venv", create = true, uv_create_args = ['--seed'] }

[tasks.install]
description = "Install project dependencies"
run = "pip install -r requirements.txt"

[tasks.install-dev]
description = "Install development dependencies"
run = [
  "pip install -r requirements.txt",
  "pip install -r requirements-testing.txt",
  "pip install -e ."
]

[tasks.test]
description = "Run tests in strict mode (no network access)"
run = "pytest tests/ --record-mode=none --block-network --allowed-hosts=localhost -v"

[tasks.test-coverage]
description = "Run tests with coverage report"
run = "pytest tests/ --record-mode=none --block-network --allowed-hosts=localhost --cov=youtube_comment_downloader --cov-report=term-missing --cov-report=html"

[tasks.test-record]
description = "Record new test cassettes (requires internet)"
run = "pytest tests/ --record-mode=rewrite -v -m network"

[tasks.cassette-refresh]
description = "Refresh all VCR cassettes"
run = "python tests/scripts/refresh_cassettes.py --all"

[tasks.cassette-check]
description = "Check cassette age (warn if older than 30 days)"
run = "python tests/scripts/refresh_cassettes.py --check-age --max-age 30"

[tasks.lint]
description = "Run linting checks"
run = [
  "python -m py_compile youtube_comment_downloader/*.py",
  "python -m py_compile tests/*.py"
]

[tasks.clean]
description = "Clean build artifacts"
run = [
  "rm -rf build/",
  "rm -rf dist/",
  "rm -rf *.egg-info",
  "find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true",
  "find . -type f -name '*.pyc' -delete",
  "find . -type f -name '*.pyo' -delete"
]