name: Refresh Test Cassettes

on:
  schedule:
    # Run monthly on the 1st at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Specific test to refresh (leave empty for all)'
        required: false
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-testing.txt
        pip install -e .

    - name: Check cassette ages
      run: |
        python tests/scripts/refresh_cassettes.py --check-age --max-age 30

    - name: Refresh specific test cassettes
      if: github.event.inputs.test_name
      run: |
        python tests/scripts/refresh_cassettes.py --test "${{ github.event.inputs.test_name }}"

    - name: Refresh all cassettes
      if: '!github.event.inputs.test_name'
      run: |
        python tests/scripts/refresh_cassettes.py --all

    - name: Verify refreshed cassettes
      run: |
        pytest tests/ \
          --record-mode=none \
          --block-network \
          --allowed-hosts=localhost \
          -v \
          -m network

    - name: Check for changes
      id: check_changes
      run: |
        git add tests/cassettes/
        if git diff --staged --quiet; then
          echo "No changes to cassettes"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Cassettes have been updated"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          git diff --staged --stat

    - name: Create Pull Request
      if: steps.check_changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: |
          chore: refresh test cassettes [automated]

          This automated PR refreshes the VCR test cassettes to ensure they
          remain up-to-date with any YouTube API changes.

          Generated by GitHub Actions workflow: refresh-cassettes.yml
        branch: refresh-cassettes-${{ github.run_number }}
        delete-branch: true
        title: 'chore: refresh test cassettes [automated]'
        body: |
          ## 🔄 Automated Cassette Refresh

          This PR automatically refreshes the VCR test cassettes used for mocking YouTube API responses.

          ### Why refresh cassettes?
          - YouTube's HTML structure and API responses can change over time
          - Ensures tests remain accurate and reflect current YouTube behavior
          - Prevents test failures due to outdated mock data

          ### What changed?
          The cassettes in `tests/cassettes/` have been regenerated by running all tests
          with `--record-mode=rewrite` to capture fresh YouTube responses.

          ### Verification
          ✅ All tests pass with the new cassettes in strict mode (no network access)

          ### Next steps
          1. Review the changes to ensure no sensitive data was recorded
          2. Verify tests still pass locally
          3. Merge to keep test data current

          ---
          *Generated on ${{ github.event.repository.updated_at }} by GitHub Actions*
        labels: |
          automated
          tests
          maintenance
        assignees: ${{ github.repository_owner }}

    - name: Summary
      if: always()
      run: |
        echo "## Cassette Refresh Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]]; then
          echo "✅ Cassettes have been refreshed and a PR has been created" >> $GITHUB_STEP_SUMMARY
        else
          echo "ℹ️ No changes needed - cassettes are already up to date" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Cassette Statistics" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        find tests/cassettes -name "*.yaml" -o -name "*.yml" | wc -l | xargs echo "Total cassettes:" >> $GITHUB_STEP_SUMMARY
        du -sh tests/cassettes | xargs echo "Total size:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY